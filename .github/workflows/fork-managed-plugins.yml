name: Fork managed plugins
on:
  push:
    branches: [fork/managed-plugin-promotions, fork/maintenance-reservation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/npm-retry.mjs ci
      - run: npm run format:files -- packages/cli/src/commands/daemon/index.ts packages/cli/src/commands/daemon/maintenance.ts packages/cli/src/commands/daemon/reload.test.ts packages/server/src/server/authorization/index.test.ts packages/client/src/daemon-client.ts packages/protocol/src/messages.ts packages/server/package.json packages/server/src/server/maintenance-reservation.ts packages/server/src/server/maintenance-offline.ts packages/server/src/server/provider-maintenance.ts packages/server/src/utils/spawn.ts packages/server/src/utils/spawn.test.ts packages/server/src/server/agent/provider-registry.ts packages/server/src/server/agent/provider-snapshot-manager.ts packages/server/src/server/agent/agent-manager.test.ts packages/server/src/server/bootstrap.smoke.test.ts packages/server/src/server/schedule/service.test.ts packages/server/src/server/agent/agent-manager.ts packages/server/src/server/agent/create-agent/create.ts packages/server/src/server/authorization/operation-permissions.ts packages/server/src/server/bootstrap.ts packages/server/src/server/schedule/service.ts packages/server/src/server/session.ts packages/server/src/server/session/daemon/daemon-session.test.ts packages/server/src/server/websocket-server.ts packages/server/src/server/workspace-setup-runtime.ts packages/server/src/server/worktree-bootstrap.ts packages/server/src/server/worktree-bootstrap.test.ts packages/server/src/server/worktree-session.ts
      - if: always()
        run: git diff > /tmp/maintenance-format.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintenance-format
          path: /tmp/maintenance-format.patch
      - run: git diff --exit-code
      - run: npm run build:server-deps
      - run: npm run build --workspace=@getpaseo/server
      - run: npm run typecheck:server
      - run: npm run typecheck --workspace=@getpaseo/cli
      - run: npm run lint
      - run: npm run format:check:files -- packages/cli/src/commands/daemon/index.ts packages/cli/src/commands/daemon/maintenance.ts packages/cli/src/commands/daemon/reload.test.ts packages/server/src/server/authorization/index.test.ts packages/client/src/daemon-client.ts packages/protocol/src/messages.ts packages/server/package.json packages/server/src/server/maintenance-reservation.ts packages/server/src/server/maintenance-offline.ts packages/server/src/server/provider-maintenance.ts packages/server/src/utils/spawn.ts packages/server/src/utils/spawn.test.ts packages/server/src/server/agent/provider-registry.ts packages/server/src/server/agent/provider-snapshot-manager.ts packages/server/src/server/agent/agent-manager.test.ts packages/server/src/server/bootstrap.smoke.test.ts packages/server/src/server/schedule/service.test.ts packages/server/src/server/agent/agent-manager.ts packages/server/src/server/agent/create-agent/create.ts packages/server/src/server/authorization/operation-permissions.ts packages/server/src/server/bootstrap.ts packages/server/src/server/schedule/service.ts packages/server/src/server/session.ts packages/server/src/server/session/daemon/daemon-session.test.ts packages/server/src/server/websocket-server.ts packages/server/src/server/workspace-setup-runtime.ts packages/server/src/server/worktree-bootstrap.ts packages/server/src/server/worktree-bootstrap.test.ts packages/server/src/server/worktree-session.ts
      - run: npm run test:unit --workspace=@getpaseo/server -- src/server/plugins/index.posix.test.ts src/server/plugins/managed-source.posix.test.ts src/server/plugins/runtime.posix.test.ts src/server/plugins/requirements.posix.test.ts src/server/session.test.ts src/server/session/daemon/daemon-session.test.ts src/server/bootstrap.smoke.test.ts src/server/worktree-bootstrap.test.ts src/server/schedule/service.test.ts src/server/agent/agent-manager.test.ts src/server/agent/provider-registry.test.ts src/server/agent/provider-snapshot-manager.test.ts src/utils/spawn.test.ts src/server/authorization/index.test.ts
      - run: npm run test:unit --workspace=@getpaseo/cli -- src/commands/plugin/index.test.ts src/commands/daemon/reload.test.ts
      - run: npm run test --workspace=@getpaseo/protocol -- src/messages.plugins.test.ts
