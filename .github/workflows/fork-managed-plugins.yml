name: Fork managed plugins
on:
  push:
    branches: [fork/managed-plugin-promotions, fork/maintenance-reservation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/npm-retry.mjs ci
      - run: npm run format:files -- .oxlintrc.json docs/development.md packages/cli/src/commands/daemon/index.ts packages/cli/src/commands/daemon/maintenance.ts packages/cli/src/commands/daemon/reload.test.ts packages/server/src/server/authorization/index.test.ts packages/client/src/daemon-client.ts packages/protocol/src/messages.ts packages/protocol/src/messages.plugins.test.ts packages/server/package.json packages/server/tsconfig.scripts.json packages/server/src/server/maintenance-reservation.ts packages/server/src/server/maintenance-offline.ts packages/server/src/server/provider-maintenance.ts packages/server/src/server/maintenance-participant.ts packages/server/src/server/maintenance-operation.ts packages/server/src/server/maintenance-recovery.ts packages/server/src/server/session/provider/provider-catalog-session.test.ts packages/server/src/utils/spawn.ts packages/server/src/utils/spawn.test.ts packages/server/src/server/agent/provider-registry.ts packages/server/src/server/agent/provider-snapshot-manager.ts packages/server/src/server/agent/agent-manager.test.ts packages/server/src/server/bootstrap.smoke.test.ts packages/server/src/server/test-utils/session-stubs.ts packages/server/src/server/session.test.ts packages/server/src/server/schedule/service.test.ts packages/server/src/server/agent/agent-manager.ts packages/server/src/server/agent/create-agent/create.ts packages/server/src/server/authorization/operation-permissions.ts packages/server/src/server/bootstrap.ts packages/server/src/server/schedule/service.ts packages/server/src/server/session.ts packages/server/src/server/session/daemon/daemon-session.test.ts packages/server/src/server/websocket-server.ts packages/server/src/server/workspace-setup-runtime.ts packages/server/src/server/worktree-bootstrap.ts packages/server/src/server/worktree-bootstrap.test.ts packages/server/src/server/worktree-session.ts
      - if: always()
        run: git diff > /tmp/maintenance-format.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintenance-format
          path: /tmp/maintenance-format.patch
      - run: git diff --exit-code
      - run: npm run build:server-deps
      - run: npm run build --workspace=@getpaseo/server
      - run: npm run typecheck:server
      - run: npm run typecheck --workspace=@getpaseo/cli
      - run: npm run lint -- --format json > /tmp/maintenance-lint.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintenance-lint
          path: /tmp/maintenance-lint.json
      - run: npm run format:check:files -- docs/plugins.md packages/plugin/package.json packages/plugin/src/server/process.ts packages/plugin/src/server/process-internal/activity.ts packages/plugin/src/server/process-internal/activity.test.ts packages/plugin/src/server/process-internal/builtin-helper.ts packages/plugin/src/server/process-internal/builtin-exec-collector.ts packages/server/src/server/plugins/activation-policy.ts packages/server/src/server/plugins/managed-status.ts packages/server/src/server/plugins/index.ts packages/server/src/server/plugins/index.posix.test.ts packages/server/src/server/plugins/runtime.ts packages/server/src/server/plugins/internal-child.ts packages/server/src/server/plugins/plugin-process.ts packages/server/src/server/plugins/plugin-process.test.ts packages/server/src/server/plugins/plugin-process-protocol.ts packages/server/src/server/plugins/execution-owner.ts packages/server/src/server/plugins/execution-owner.test.ts packages/server/src/server/plugins/execution-roots.ts packages/server/src/server/plugins/maintenance.ts packages/server/src/server/plugins/agent-tools.ts packages/server/src/server/plugins/lifecycle/index.ts packages/server/src/server/plugins/subscription-handlers.ts packages/cli/src/commands/plugin/index.ts packages/cli/src/commands/plugin/shared.ts packages/cli/src/commands/plugin/index.test.ts packages/cli/src/cli-surface.test.ts packages/protocol/src/messages.plugins.test.ts packages/plugin/src/server/contracts.ts packages/server/src/server/plugins/held-operation.ts packages/server/src/server/plugins/qualified-initialization.ts packages/server/src/server/plugins/builtin/index.ts packages/server/src/server/plugins/compiler.ts packages/server/src/server/plugins/compiler-worker.ts packages/server/src/server/plugins/compiler-build.ts packages/server/src/server/plugins/compiler.test.ts
      - run: npm run format:check:files -- .oxlintrc.json docs/development.md packages/cli/src/commands/daemon/index.ts packages/cli/src/commands/daemon/maintenance.ts packages/cli/src/commands/daemon/reload.test.ts packages/server/src/server/authorization/index.test.ts packages/client/src/daemon-client.ts packages/protocol/src/messages.ts packages/protocol/src/messages.plugins.test.ts packages/server/package.json packages/server/tsconfig.scripts.json packages/server/src/server/maintenance-reservation.ts packages/server/src/server/maintenance-offline.ts packages/server/src/server/provider-maintenance.ts packages/server/src/server/maintenance-participant.ts packages/server/src/server/maintenance-operation.ts packages/server/src/server/maintenance-recovery.ts packages/server/src/server/session/provider/provider-catalog-session.test.ts packages/server/src/utils/spawn.ts packages/server/src/utils/spawn.test.ts packages/server/src/server/agent/provider-registry.ts packages/server/src/server/agent/provider-snapshot-manager.ts packages/server/src/server/agent/agent-manager.test.ts packages/server/src/server/bootstrap.smoke.test.ts packages/server/src/server/test-utils/session-stubs.ts packages/server/src/server/session.test.ts packages/server/src/server/schedule/service.test.ts packages/server/src/server/agent/agent-manager.ts packages/server/src/server/agent/create-agent/create.ts packages/server/src/server/authorization/operation-permissions.ts packages/server/src/server/bootstrap.ts packages/server/src/server/schedule/service.ts packages/server/src/server/session.ts packages/server/src/server/session/daemon/daemon-session.test.ts packages/server/src/server/websocket-server.ts packages/server/src/server/workspace-setup-runtime.ts packages/server/src/server/worktree-bootstrap.ts packages/server/src/server/worktree-bootstrap.test.ts packages/server/src/server/worktree-session.ts
      - run: npm run test:unit --workspace=@getpaseo/server -- src/server/plugins/index.posix.test.ts src/server/plugins/managed-source.posix.test.ts src/server/plugins/runtime.posix.test.ts src/server/plugins/requirements.posix.test.ts src/server/plugins/execution-owner.test.ts src/server/plugins/plugin-process.test.ts src/server/plugins/compiler.test.ts src/server/session.test.ts src/server/session/daemon/daemon-session.test.ts src/server/bootstrap.smoke.test.ts src/server/worktree-bootstrap.test.ts src/server/schedule/service.test.ts src/server/agent/agent-manager.test.ts src/server/agent/provider-registry.test.ts src/server/agent/provider-snapshot-manager.test.ts src/utils/spawn.test.ts src/server/authorization/index.test.ts src/server/session/provider/provider-catalog-session.test.ts
      - run: npm run format:check
      - run: npm exec --workspace=@getpaseo/plugin -- vitest run src/server/process.test.ts src/server/process-internal/activity.test.ts
      - run: npm exec --workspace=@getpaseo/cli -- vitest run src/commands/plugin src/cli-surface.test.ts src/commands/daemon/reload.test.ts
      - run: npm run test --workspace=@getpaseo/protocol -- src/messages.plugins.test.ts
