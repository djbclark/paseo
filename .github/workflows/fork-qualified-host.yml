name: Fork Qualified Host
on:
  push:
    branches: [fork/qualified-execution-host]
  workflow_dispatch:
    inputs:
      namespace_proof:
        description: Run privileged acquisition only after exact helper source adversary approval
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: qualified-host-${{ github.ref }}
  cancel-in-progress: false
env:
  ONNXRUNTIME_NODE_INSTALL: skip
jobs:
  sealed-linux-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: node scripts/npm-retry.mjs ci
      - name: CI namespace administrative source tests (not execution qualification)
        run: /usr/bin/python3 -I packages/server/scripts/qualified-system-namespace.test.py
      - name: Build actual workspace SDK declarations and code
        id: build_workspace
        run: npm run build:server
      - name: Typecheck server producer
        run: npm run typecheck --workspace=@getpaseo/server
      - name: Focused producer lint
        run: npm run lint -- packages/server/src/server/execution packages/server/scripts/build-qualified-git.mjs packages/server/scripts/qualified-git.test.mjs packages/server/scripts/build-qualified-host.mjs packages/server/scripts/finalize-qualified-host.mjs packages/server/scripts/qualified-host.test.mjs packages/server/scripts/build-qualified-daemon.mjs packages/server/scripts/qualified-builtin-sources.mjs packages/server/scripts/retain-system-closure.mjs packages/server/scripts/build-qualified-builtins.mjs packages/server/scripts/finalize-qualified-daemon.mjs packages/server/scripts/qualified-daemon.test.mjs packages/server/scripts/archive-qualified-daemon.mjs packages/server/scripts/qualified-measurement.test.mjs packages/server/src/terminal/terminal-worker-launch.ts packages/server/src/terminal/worker-terminal-manager.ts
      - name: Focused formatting
        run: npm run format:check:files -- packages/server/src/server/execution packages/server/scripts/build-qualified-git.mjs packages/server/scripts/qualified-git.test.mjs packages/server/scripts/build-qualified-host.mjs packages/server/scripts/finalize-qualified-host.mjs packages/server/scripts/qualified-host.test.mjs packages/server/scripts/build-qualified-daemon.mjs packages/server/scripts/qualified-builtin-sources.mjs packages/server/scripts/retain-system-closure.mjs packages/server/scripts/build-qualified-builtins.mjs packages/server/scripts/finalize-qualified-daemon.mjs packages/server/scripts/qualified-daemon.test.mjs packages/server/scripts/archive-qualified-daemon.mjs packages/server/scripts/qualified-measurement.test.mjs packages/server/src/terminal/terminal-worker-launch.ts packages/server/src/terminal/worker-terminal-manager.ts .github/workflows/fork-qualified-host.yml
      - name: Actual compiler Worker task drain and late helper regression
        run: npm exec --workspace=@getpaseo/server -- vitest run src/server/plugins/compiler.test.ts --bail=1
      - name: Genuine protected-root A/B launches and closed dependency negatives
        run: node --test packages/server/scripts/qualified-host.test.mjs
      - name: Bounded observation, canonical profile and ELF source tests
        run: node --test packages/server/scripts/qualified-measurement.test.mjs
      - name: Build finite actual daemon distribution (no support inferred from build)
        run: node packages/server/scripts/build-qualified-daemon.mjs "$RUNNER_TEMP/qualified-daemon" "ci-${{ github.sha }}"
      - name: Finalize Linux runtime and native/helper inventory
        run: node packages/server/scripts/finalize-qualified-daemon.mjs "$RUNNER_TEMP/qualified-daemon" "$(command -v node)" "$(printf '%s' finite-ci-recipe-v2 | sha256sum | cut -d' ' -f1)"
      - name: Actual finite Git gate and control-loss source checks (no profile grant)
        if: always() && steps.build_workspace.outcome == 'success'
        run: node --test packages/server/scripts/qualified-git.test.mjs
      - name: Archive measured build inputs (no qualification or runtime acceptance)
        run: node packages/server/scripts/archive-qualified-daemon.mjs "$RUNNER_TEMP/qualified-daemon" "$RUNNER_TEMP/qualified-daemon-build-artifact"
      - name: Retain build-only distribution evidence
        uses: actions/upload-artifact@v4
        with:
          name: qualified-daemon-build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualified-daemon-build-artifact/
          if-no-files-found: error
      - name: Reviewed privileged system namespace acquisition (not full cohort qualification)
        if: github.event_name == 'workflow_dispatch' && inputs.namespace_proof
        env:
          QUALIFIED_DAEMON_ROOT: ${{ runner.temp }}/qualified-daemon
        run: node --test packages/server/scripts/qualified-daemon.test.mjs
