name: Fork Qualified Host
on:
  push:
    branches: [fork/qualified-execution-host]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qualified-host-${{ github.ref }}
  cancel-in-progress: false
env:
  ONNXRUNTIME_NODE_INSTALL: skip
jobs:
  sealed-linux-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: node scripts/npm-retry.mjs ci
      - name: Build actual workspace SDK declarations and code
        run: npm run build:server
      - name: Typecheck server producer
        run: npm run typecheck --workspace=@getpaseo/server
      - name: Focused producer lint
        run: npm run lint -- packages/server/src/server/execution packages/server/scripts/build-qualified-host.mjs packages/server/scripts/finalize-qualified-host.mjs packages/server/scripts/qualified-host.test.mjs packages/server/scripts/build-qualified-daemon.mjs packages/server/scripts/finalize-qualified-daemon.mjs packages/server/scripts/qualified-daemon.test.mjs packages/server/src/terminal/terminal-worker-launch.ts packages/server/src/terminal/worker-terminal-manager.ts
      - name: Focused formatting
        run: npm run format:check:files -- packages/server/src/server/execution packages/server/scripts/build-qualified-host.mjs packages/server/scripts/finalize-qualified-host.mjs packages/server/scripts/qualified-host.test.mjs packages/server/scripts/build-qualified-daemon.mjs packages/server/scripts/finalize-qualified-daemon.mjs packages/server/scripts/qualified-daemon.test.mjs packages/server/src/terminal/terminal-worker-launch.ts packages/server/src/terminal/worker-terminal-manager.ts .github/workflows/fork-qualified-host.yml
      - name: Genuine protected-root A/B launches and closed dependency negatives
        run: node --test packages/server/scripts/qualified-host.test.mjs
      - name: Build finite actual daemon distribution (no support inferred from build)
        run: node packages/server/scripts/build-qualified-daemon.mjs "$RUNNER_TEMP/qualified-daemon" "ci-${{ github.sha }}"
      - name: Finalize Linux runtime and native/helper inventory
        run: node packages/server/scripts/finalize-qualified-daemon.mjs "$RUNNER_TEMP/qualified-daemon" "$(command -v node)" "$(printf '%s' finite-ci-recipe-v2 | sha256sum | cut -d' ' -f1)"
      - name: Exact v2 retained inventory, revocation and bounded FIFO negatives
        env:
          QUALIFIED_DAEMON_ROOT: ${{ runner.temp }}/qualified-daemon
        run: node --test packages/server/scripts/qualified-daemon.test.mjs
