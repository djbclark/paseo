name: Qualified copied node-pty source build

on:
  push:
    branches: [fork/qualified-node-pty-build]
    paths:
      - packages/server/scripts/build-qualified-node-pty.mjs
      - packages/server/scripts/qualified-node-pty.test.mjs
      - docs/qualified-node-pty-build.md
      - .github/workflows/fork-qualified-node-pty.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Formatter dependencies only; no package lifecycle
        run: npm ci --ignore-scripts
      - name: Scoped source formatter
        run: npm run format:files -- packages/server/scripts/build-qualified-node-pty.mjs packages/server/scripts/qualified-node-pty.test.mjs .github/workflows/fork-qualified-node-pty.yml docs/qualified-node-pty-build.md
      - name: Retain exact formatter patch
        if: always()
        run: git diff > /tmp/nodepty-format.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nodepty-format
          path: /tmp/nodepty-format.patch
      - run: git diff --exit-code
      - name: Provision checksum-verified public inputs before offline build
        shell: python
        run: |
          import hashlib, json, os, pathlib, shutil, tarfile, urllib.request
          base = pathlib.Path(os.environ["RUNNER_TEMP"]) / "nodepty"
          base.mkdir()
          rows = [
              ("node", "https://nodejs.org/dist/v22.23.5/node-v22.23.5-linux-x64.tar.xz", "cdeb8670a0c81f51b4dc4ac61919f9b1ad917b304bf8221eb939570663d240f8", 40 * 1024 * 1024),
              ("pty", "https://registry.npmjs.org/node-pty/-/node-pty-1.2.0-beta.15.tgz", "114ac80c3fe075eff76217a4122d135576582695f49c03a5da3835cdfc2f89c5", 12 * 1024 * 1024),
              ("api", "https://registry.npmjs.org/node-addon-api/-/node-addon-api-7.1.1.tgz", "b10455d15a977c0cd17a1cb0eb679e03d939f8ef8d4302eb33e1f78dacc71f82", 1024 * 1024),
          ]
          for name, url, expected, bound in rows:
              with urllib.request.urlopen(url, timeout=60) as response:
                  data = response.read(bound + 1)
              assert len(data) <= bound and hashlib.sha256(data).hexdigest() == expected
              archive = base / (name + ".archive")
              archive.write_bytes(data)
              destination = base / name
              destination.mkdir()
              with tarfile.open(archive) as packed:
                  packed.extractall(destination, filter="data")
          node = base / "node/node-v22.23.5-linux-x64"
          root = base / "root"
          (root / "node_modules").mkdir(parents=True)
          (root / "runtime").mkdir()
          shutil.copytree(base / "pty/package", root / "node_modules/node-pty")
          shutil.copytree(base / "api/package", root / "node_modules/node-addon-api")
          shutil.copy2(node / "bin/node", root / "runtime/node")
          stage = base / "staging"
          stage.mkdir()
          inputs = {
              "root": str(root),
              "options": {
                  "runtime": str(root / "runtime/node"),
                  "headersRoot": str(node),
                  "nodeGypRoot": str(node / "lib/node_modules/npm/node_modules/node-gyp"),
                  "toolchainRoot": "/usr",
                  "stagingRoot": str(stage),
              },
          }
          prepared = base / "prepared.json"
          prepared.write_text(json.dumps(inputs))
          with open(os.environ["GITHUB_ENV"], "a") as environment:
              environment.write("QUALIFIED_NODE_PTY_INPUTS=" + str(prepared) + "\n")
      - name: Focused build receipt and actual copied addon API tests
        run: node --test packages/server/scripts/qualified-node-pty.test.mjs
      - name: Scoped lint
        run: npm run lint -- packages/server/scripts/build-qualified-node-pty.mjs packages/server/scripts/qualified-node-pty.test.mjs
      - name: Committed source formatting
        run: npm run format:check:files -- packages/server/scripts/build-qualified-node-pty.mjs packages/server/scripts/qualified-node-pty.test.mjs .github/workflows/fork-qualified-node-pty.yml docs/qualified-node-pty-build.md
      - name: Retain source build evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nodepty-build-evidence
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/nodepty/copy-*/native-provenance/
            ${{ runner.temp }}/nodepty/copy-*/node_modules/node-pty/prebuilds/linux-x64/pty.node
            ${{ runner.temp }}/nodepty/staging/nodepty-*/**/*.log
            ${{ runner.temp }}/nodepty/staging/nodepty-*/*.json
            ${{ runner.temp }}/nodepty/staging/nodepty-*/*.map
            ${{ runner.temp }}/nodepty/staging/nodepty-*/*.d
            ${{ runner.temp }}/nodepty/staging/nodepty-*/**/*.ii
            ${{ runner.temp }}/nodepty/staging/nodepty-*/node_modules/node-pty/build/Release/pty.node
